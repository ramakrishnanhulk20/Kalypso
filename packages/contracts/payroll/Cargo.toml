[package]
name = "kalypso-payroll"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "=1.11.0"
# The real registry, so create_company's owner check runs against the code
# deployed on testnet. Tests only: the payroll's wasm does not link it.
kalypso-auditor = { path = "../auditor" }
