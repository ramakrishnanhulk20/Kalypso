name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
          targets: wasm32v1-none
          components: clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - uses: stellar/stellar-cli@v28.1.0

      # Every cargo command names one package. A workspace-wide run unifies features across both
      # crates, which switches on soroban-sdk's experimental_spec_shaking_v2 (pulled in by the
      # auditor's OpenZeppelin dependency) for the payroll crate's contractimport.
      - run: cargo test -p kalypso-payroll --locked
      - run: cargo test -p kalypso-auditor --locked

      - run: cargo clippy -p kalypso-payroll --locked --all-targets -- -D warnings
      - run: cargo clippy -p kalypso-auditor --locked --all-targets -- -D warnings

      - run: cargo llvm-cov -p kalypso-payroll --locked --fail-under-lines 90
      - run: cargo llvm-cov -p kalypso-auditor --locked --fail-under-lines 90

      - run: stellar contract build --package kalypso-payroll
      - run: stellar contract build --package kalypso-auditor

      # Handy for reviewing a pull request's wasm. Never deploy these: testnet contracts come from
      # the attested files on a tagged release (release.yml).
      - uses: actions/upload-artifact@v7
        with:
          name: contracts-wasm
          path: |
            packages/contracts/target/wasm32v1-none/release/kalypso_payroll.wasm
            packages/contracts/target/wasm32v1-none/release/kalypso_auditor.wasm
          if-no-files-found: error

  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned image tag, as Scout's README advises for automation. SCOUT_OFFLINE stops its
      # telemetry and update check, so the job's only network use is pulling the image.
      - name: Scout static analysis
        run: >-
          docker run --rm --platform linux/amd64
          -e SCOUT_OFFLINE=1
          -e INPUT_TARGET=/scoutme/packages/contracts
          -e INPUT_SCOUT_ARGS="--output-format md,json"
          -v "$PWD:/scoutme"
          coinfabrik/scout:0.3.17

      # Logs and artifacts need a GitHub sign-in to read, so the findings are also published where
      # anyone can see them: the run summary, and one annotation (readable through the API) that
      # lists every finding on its own line, because an annotation is cut off at about 4 KB.
      - name: Publish Scout report
        if: always()
        run: |
          report=$(find . -name report.md -not -path './node_modules/*' | head -1)
          if [ -z "$report" ]; then
            echo "::warning title=Scout::no report.md was produced"
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$report" <<'PY'
          import re, sys
          title = impact = None
          rows = []
          for line in open(sys.argv[1], encoding="utf-8"):
              if m := re.match(r"^### (.+)", line):
                  title, impact = m.group(1).strip(), None
              elif m := re.match(r"^\*\*Impact:\*\* (\w+)", line):
                  impact = m.group(1)
              elif title and (m := re.match(r"^\| (\d+) \| (\w+) \| \[([^\]]+)\]", line)):
                  rows.append(f"#{m.group(1)} [{impact}] {title}: {m.group(2)} {m.group(3)}")
          print("::notice title=Scout findings (" + str(len(rows)) + ")::" + "%0A".join(rows))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: scout-report
          path: |
            **/report.md
            **/report.json
          if-no-files-found: warn

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm audit --audit-level=high

      - name: prove rules
        working-directory: packages/contracts/scripts
        run: node --test lib/*.test.mjs

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm audit --audit-level=high
